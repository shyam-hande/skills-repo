version: '3.8'

services:

  db:
    image: postgres:16
    container_name: litellm-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbpass123
      POSTGRES_DB: litellm
      DATABASE_URL: postgresql://postgres:dbpass123@db:5432/litellm
      LITELLM_MASTER_KEY: sk-1234
      GEMINI_API_KEY: ${GEMINI_API_KEY}



    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest

    container_name: litellm-gateway

    ports:
      - "4000:4000"

    depends_on:
      - db

    volumes:
      - ./config.yaml:/app/config.yaml
      - ~/skills-repo:/app/skills-repo

    environment:
      DATABASE_URL: postgresql://postgres:dbpass123@db:5432/litellm
      LITELLM_MASTER_KEY: sk-1234
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--detailed_debug"
      ]

volumes:
  pgdata: